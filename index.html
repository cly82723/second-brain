<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Periods</title>
  <meta name="description" content="Periods: a private logbook, timetable and to-do list for teachers.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f3ef">
  <meta name="apple-mobile-web-app-title" content="Periods">
  <meta name="application-name" content="Periods">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Main">
      <div class="brand"><img class="brand-mark" src="icon.svg" alt="" width="30" height="30"><span>Periods</span></div>
      <nav class="nav" id="nav-side"></nav>
      <button type="button" class="btn btn-ink new-btn" id="new-side" hidden>New…</button>
      <div class="sidebar-foot" id="who"></div>
    </aside>
    <main class="main" id="main" tabindex="-1">
      <div class="loading">Opening your notebook…</div>
    </main>
    <nav class="tabbar" id="nav-tabs" aria-label="Main" hidden></nav>
    <button type="button" class="fab" id="new-fab" aria-label="New item, to-do or marking" hidden>+</button>
  </div>
  <div id="layer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    // If anything below fails, say so on screen instead of hanging on "Opening your notebook…".
    window.addEventListener("error", function (e) {
      var main = document.getElementById("main");
      if (!main || !main.querySelector(".loading")) return;
      main.innerHTML = '<div class="error-page"><h1>Your notebook didn\'t open</h1><p>Something on this page failed to load:</p><pre style="white-space:pre-wrap;text-align:left"></pre></div>';
      main.querySelector("pre").textContent = (e.message || "Unknown error") + (e.lineno ? " (line " + e.lineno + ")" : "");
    });
  </script>
  <script src="core/logic.js"></script>
  <script>var L = logic_();</script>
  <script src="core/remote.js"></script>
  <script src="core/export.js"></script>
  <script src="app/app.js"></script>
  <script src="app/views.js"></script>
  <script src="app/today.js"></script>
  <script src="app/calendar.js"></script>
  <script src="app/tasks.js"></script>
  <script src="app/marking.js"></script>
  <script src="app/editors.js"></script>
  <script src="app/connect.js"></script>
  <script src="app/settings.js"></script>
</body>
</html>
