<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Teachers' Second Brain</title>
  <meta name="description" content="A private logbook, timetable and to-do list for teachers.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f3ef">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c2541'/%3E%3Crect x='9' y='11' width='14' height='2.5' rx='1.25' fill='white'/%3E%3Crect x='9' y='18' width='9' height='2.5' rx='1.25' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" aria-label="Main">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Teachers'<br>Second Brain</span></div>
      <nav class="nav" id="nav-side"></nav>
      <button type="button" class="btn btn-ink new-btn" id="new-side" hidden>New…</button>
      <div class="sidebar-foot" id="who"></div>
    </aside>
    <main class="main" id="main" tabindex="-1">
      <div class="loading">Opening your notebook…</div>
    </main>
    <nav class="tabbar" id="nav-tabs" aria-label="Main" hidden></nav>
    <button type="button" class="fab" id="new-fab" aria-label="New to-do or event" hidden>+</button>
  </div>
  <div id="layer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    // If anything below fails, say so on screen instead of hanging on "Opening your notebook…".
    window.addEventListener("error", function (e) {
      var main = document.getElementById("main");
      if (!main || !main.querySelector(".loading")) return;
      main.innerHTML = '<div class="error-page"><h1>Your notebook didn\'t open</h1><p>Something on this page failed to load:</p><pre style="white-space:pre-wrap;text-align:left"></pre></div>';
      main.querySelector("pre").textContent = (e.message || "Unknown error") + (e.lineno ? " (line " + e.lineno + ")" : "");
    });
  </script>
  <script src="core/logic.js"></script>
  <script>var L = logic_();</script>
  <script src="core/schools.js"></script>
  <script src="core/validate.js"></script>
  <script src="core/backend.js"></script>
  <script src="app/app.js"></script>
  <script src="app/views.js"></script>
  <script src="app/editors.js"></script>
  <script src="app/connect.js"></script>
  <script src="app/settings.js"></script>
</body>
</html>
